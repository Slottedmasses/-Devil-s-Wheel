<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>恶魔轮盘 · Devil's Roulette</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1 class="title">😈 恶 魔 轮 盘 😈</h1>
    <p class="subtitle">Devil's Roulette · 签署生死状后开始挑战</p>

    <div class="wheel-container">
      <div class="pointer">▼</div>
      <div class="wheel" id="wheel">
        <div class="wheel-center">命运<br/>之轮</div>
      </div>
    </div>

    <button class="spin-btn" id="spinBtn" onclick="showContract()">
      签 署 生 死 状
    </button>

    <div class="result-area" id="resultArea">
      <div class="result-card">
        <div class="result-icon" id="resultIcon">😈</div>
        <h2 id="resultLevel">挑战</h2>
        <p id="resultText">挑战内容</p>
        <div class="result-actions">
          <button class="accept-btn" onclick="acceptChallenge()">画押认命</button>
          <button class="quit-btn" onclick="quitChallenge()">撕毁生死状</button>
        </div>
      </div>
    </div>

    <div class="history-area">
      <h3>生死状记录</h3>
      <ul id="historyList"></ul>
    </div>
  </div>

  <div class="contract-overlay" id="contractOverlay">
    <div class="contract-box">
      <h2>生 死 状</h2>
      <p>转动即认命，结果不可反悔。</p>
      <p>是否以灵魂为证，启动命轮？</p>
      <div class="contract-actions">
        <button onclick="acceptContract('画押')">是，画押</button>
        <button class="quit-btn" onclick="acceptContract('拒绝')">否，离开</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
